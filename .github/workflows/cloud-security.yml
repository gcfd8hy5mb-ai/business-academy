name: Business and Law cloud security
on:
  pull_request:
    paths:
      - 'firebase/business-law-firestore.rules'
      - 'tests/cloud-firestore-rules.test.cjs'
      - '.github/workflows/cloud-security.yml'
  push:
    branches:
      - 'feature/academy-cloud-sync-foundation'
    paths:
      - 'firebase/business-law-firestore.rules'
      - 'tests/cloud-firestore-rules.test.cjs'
      - '.github/workflows/cloud-security.yml'
jobs:
  firestore-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --no-save --no-audit --no-fund @firebase/rules-unit-testing@4.0.1 firebase@11.10.0 firebase-tools@14.0.0
      - run: npx firebase-tools emulators:exec --project business-law-rules-test --only firestore 'node --test tests/cloud-firestore-rules.test.cjs'
