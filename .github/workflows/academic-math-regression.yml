  push:
    paths:
      - 'audits/scripts/required-exam-candidates-regression-v149.cjs'
      - 'audits/data/2026-11-04-required-exam-candidates-v148.json'
      - 'audits/scripts/assessment-transition-preflight-v147.cjs'
      - 'learning/level4-level5-independent-exams-v129.js'
      - 'learning/level2-independent-exams-v128.js'
      - 'audits/scripts/legacy-required-exam-archive-regression-v146.cjs'
      - 'audits/data/2026-11-04-required-level4-v104-exam-archive.json'
      - 'audits/data/2026-11-04-required-level2-v58-exam-archive.json'
      - 'learning/level4-primary-source-readings-v103.js'
      - 'learning/level4-mastery-depth-v101.js'
      - 'learning/level4-depth-v100.js'
      - 'learning/level4-initial-v82.js'
      - 'learning/level2-specialist-v58.js'
      - 'learning/core-v110.js'
      - 'learning/level1-final-v39.js'
      - 'learning/level2-independent-exams-v63.js'
      - 'learning/level2-numeric-v64.js'
      - 'learning/level2-multistep-v65.js'
      - 'learning/level4-executive-studios-v95.js'
      - 'learning/level4-advanced-seminars-v96.js'
      - 'learning/level4-executive-dilemmas-v97.js'
      - 'learning/level4-integrated-board-v98.js'
      - 'learning/level4-comprehensive-final-v99.js'
      - 'learning/level4-assessment-bank-v102.js'
      - 'learning/level4-short-exam-reinforcement-v104.js'
      - 'learning/level3-completion-seminars-v91.js'
      - 'learning/level3-final-depth-v79.js'
      - 'learning/level3-integrated-final-v87.js'
      - 'learning/level5-numeric-v125.js'
      - 'audits/scripts/level1-final-regression-v142.cjs'
      - 'audits/scripts/assessment-history-regression-v145.cjs'
      - 'audits/scripts/level2-level4-math-regression-v141.cjs'
      - 'audits/scripts/level4-executive-final-regression-v143.cjs'
      - 'audits/scripts/level2-numeric-multistep-regression-v144.cjs'
      - 'audits/scripts/level3-math-regression-v138.cjs'
      - 'audits/scripts/level3-final-math-regression-v139.cjs'
      - 'audits/scripts/level5-numeric-regression-v140.cjs'
      - '.github/workflows/academic-math-regression.yml'
  pull_request:
    paths:
      - 'audits/data/2026-11-04-required-exam-candidates-v148.json'
      - 'audits/scripts/assessment-transition-preflight-v147.cjs'
      - 'learning/level4-level5-independent-exams-v129.js'
      - 'learning/level2-independent-exams-v128.js'
      - 'audits/data/2026-11-04-required-level4-v104-exam-archive.json'
      - 'audits/data/2026-11-04-required-level2-v58-exam-archive.json'
      - 'learning/level4-primary-source-readings-v103.js'
      - 'learning/level4-mastery-depth-v101.js'
      - 'learning/level4-depth-v100.js'
      - 'learning/level4-initial-v82.js'
      - 'learning/level2-specialist-v58.js'
      - 'learning/core-v110.js'
      - 'learning/level1-final-v39.js'
      - 'learning/level2-independent-exams-v63.js'
      - 'learning/level2-numeric-v64.js'
      - 'learning/level2-multistep-v65.js'
      - 'learning/level4-executive-studios-v95.js'
      - 'learning/level4-advanced-seminars-v96.js'
      - 'learning/level4-executive-dilemmas-v97.js'
      - 'learning/level4-integrated-board-v98.js'
      - 'learning/level4-comprehensive-final-v99.js'
      - 'learning/level4-assessment-bank-v102.js'
      - 'learning/level4-short-exam-reinforcement-v104.js'
      - 'learning/level3-completion-seminars-v91.js'
      - 'learning/level3-final-depth-v79.js'
      - 'learning/level3-integrated-final-v87.js'
      - 'learning/level5-numeric-v125.js'
      - 'audits/scripts/**'
      - '.github/workflows/academic-math-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-mathematics:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate 96 staged versioned required-exam candidates
        run: node audits/scripts/required-exam-candidates-regression-v149.cjs
      - name: Block unsafe optional-to-required exam transitions
        run: node audits/scripts/assessment-transition-preflight-v147.cjs
      - name: Verify immutable legacy required-exam archive definitions
        run: node audits/scripts/legacy-required-exam-archive-regression-v146.cjs
      - name: Verify historical grades and new assessment fingerprints
        run: node audits/scripts/assessment-history-regression-v145.cjs
      - name: Verify 12 Level 1 integrated final answers
        run: node audits/scripts/level1-final-regression-v142.cjs
      - name: Verify Level 2 and 4 quantitative assessments
        run: node audits/scripts/level2-level4-math-regression-v141.cjs
      - name: Verify 45 original Level 4 executive and final questions
        run: node audits/scripts/level4-executive-final-regression-v143.cjs
      - name: Verify 35 Level 2 multistep and optional numeric drills
        run: node audits/scripts/level2-numeric-multistep-regression-v144.cjs
      - name: Independently verify 21 Level 3 course-seminar calculations
        run: node audits/scripts/level3-math-regression-v138.cjs
      - name: Verify 19 advanced and integrated Level 3 final-exam answers
        run: node audits/scripts/level3-final-math-regression-v139.cjs
      - name: Independently verify 30 Level 5 numeric transfer answers
        run: node audits/scripts/level5-numeric-regression-v140.cjs
