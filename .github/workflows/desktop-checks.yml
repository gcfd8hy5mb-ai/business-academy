name: Desktop Academy Checks
on:
  push:
    branches: [feature/desktop-academy]
  pull_request:
    branches: [main]
jobs:
  desktop:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify desktop integration
        run: node --test tests/desktop-integration.test.cjs
