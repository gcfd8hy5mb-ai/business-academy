name: Academy Levels 1–3 integrity
on:
  push:
    branches: [main]
    paths:
      - 'learning/**'
      - 'tests/**'
      - '.github/workflows/academy-levels-validation.yml'
      - 'index.html'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Capture validation environment
        run: |
          node --version
          git rev-parse --short HEAD
          test -f index.html
      - name: Enumerate all academy validation tests
        run: |
          for test_file in tests/levels-v72-integration.js tests/level1-integrity.js tests/level1-milestone-smoke.js tests/level1-level2-completion-audit.js tests/level1-level2-ui-milestones.js tests/level2-final-retake-regression.js tests/level1-final-retake-regression.js tests/level1-final-answer-key.js tests/level2-final-answer-key.js tests/levels-final-capstone-contract.js tests/level1-level2-final-math.js tests/level1-level2-mastery-regression.js tests/level2-numeric-and-persistence.js tests/level3-assessment-smoke.js tests/level3-mastery-regression.js tests/level3-final-answer-key.js tests/level3-final-math.js tests/level3-curriculum-integrity.js tests/level3-ui-milestone.js tests/level3-v81-answer-key.js tests/level3-v83-transfer-audit.js tests/level3-v84-historical-cases.js tests/level3-v85-evidence-contract.js tests/level3-v86-independent-math.js tests/level3-external-review-documents.js tests/level3-v87-integrated-final.js tests/level3-v88-full-learning-flow.js tests/level3-v89-workspace-events.js tests/level3-v90-completion-seminars.js tests/level3-v91-render-compatibility.js tests/level3-v92-real-tab-render.js tests/level4-v82-smoke.js; do
            test -s "$test_file" || { echo "Missing test: $test_file"; exit 1; }
          done
      - name: Latest Level 1 and Level 2 seminar integration
        run: node tests/levels-v72-integration.js
      - name: Level 1 curriculum integrity
        run: node tests/level1-integrity.js
      - name: Level 1 milestone
        run: node tests/level1-milestone-smoke.js
      - name: Combined Level 1 and Level 2 validation
        run: node tests/level1-level2-completion-audit.js
      - name: Level 1 and Level 2 dashboard milestone contracts
        run: node tests/level1-level2-ui-milestones.js
      - name: Level 2 real final mastery
        run: node tests/level2-final-retake-regression.js
      - name: Level 1 comprehensive final retakes and written gates
        run: node tests/level1-final-retake-regression.js
      - name: Level 1 comprehensive final answer key
        run: node tests/level1-final-answer-key.js
      - name: Level 2 comprehensive final answer key
        run: node tests/level2-final-answer-key.js
      - name: Level 1 and 2 final capstone contracts
        run: node tests/levels-final-capstone-contract.js
      - name: Independent corporate mathematics checks
        run: node tests/level1-level2-final-math.js
      - name: Both levels mastery and retake regression
        run: node tests/level1-level2-mastery-regression.js
      - name: Level 2 numerical grading and progress compatibility
        run: node tests/level2-numeric-and-persistence.js
      - name: Level 3 assessment integrity
        run: node tests/level3-assessment-smoke.js
      - name: Level 3 mastery and persistence
        run: node tests/level3-mastery-regression.js
      - name: Level 3 comprehensive final answer key
        run: node tests/level3-final-answer-key.js
      - name: Independent Level 3 final mathematics
        run: node tests/level3-final-math.js
      - name: Level 3 full curriculum integrity
        run: node tests/level3-curriculum-integrity.js
      - name: Level 3 final milestone UI
        run: node tests/level3-ui-milestone.js
      - name: Level 3 Version 81 independently verified case models
        run: node tests/level3-v81-answer-key.js
      - name: Level 3 Version 83 graduate transfer case validation
        run: node tests/level3-v83-transfer-audit.js
      - name: Level 3 source-backed historical case contracts
        run: node tests/level3-v84-historical-cases.js
      - name: Level 3 historical evidence lab validation
        run: node tests/level3-v85-evidence-contract.js
      - name: Level 3 independent mathematical audit v86
        run: node tests/level3-v86-independent-math.js
      - name: Level 3 external reviewer documentation integrity
        run: node tests/level3-external-review-documents.js
      - name: Level 3 second integrated executive final verification
        run: node tests/level3-v87-integrated-final.js
      - name: Level 3 full learning flow, saved progress and second-final retakes
        run: node tests/level3-v88-full-learning-flow.js
      - name: Level 3 actual workspace draft and retake event regression
        run: node tests/level3-v89-workspace-events.js
      - name: Level 3 Version 90 subject completion seminars
        run: node tests/level3-v90-completion-seminars.js
      - name: Level 3 mixed-generation rendering compatibility
        run: node tests/level3-v91-render-compatibility.js
      - name: Level 3 all-course real tab rendering smoke
        run: node tests/level3-v92-real-tab-render.js
      - name: Level 4 initial coursework and financial model smoke
        run: node tests/level4-v82-smoke.js
      - name: Publish test run summary
        if: always()
        run: |
          echo "## Levels 1–3 validation" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: \`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "See each test step above for its actual pass/fail result. A passing CI job is not external academic accreditation or device testing." >> "$GITHUB_STEP_SUMMARY"
